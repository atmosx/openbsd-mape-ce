# maped.conf -- example configuration for maped

# Network configuration
WAN_IF="pppoe0"
LEASE_IF="pppoe0"
LAN_NET="{ 192.168.100.0/24 }" # Modify to match your setup.

# gif(4) interface
GIF_IF="gif0"
# auto uses WAN_IF MTU minus 40; a numeric value overrides it.
GIF_MTU="auto"
LEASE_FILE="/var/db/dhcp6leased/pppoe0"
PF_ANCHOR_FILE="/etc/pf.anchors/mape"

# maped(8)
MAPED_STATE_DIR="/var/db/maped"
MAPED_PEER_IPV4="0.0.0.1"
MAPED_UP="/usr/local/libexec/maped/maped-up"
MAPED_DERIVE="/usr/local/libexec/maped/maped-derive"
MAPED_LOG_LEVEL="info"
