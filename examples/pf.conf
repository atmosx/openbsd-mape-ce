# pf.conf example for MAP-E CE
# Cosmote FTTH router replacement: PPPoE, MAP-E, and Asterisk.

set skip on lo
set block-policy drop

wan = "pppoe0"
mape_if = "gif0"

lan_if = "{ em1 em2 em3 }"
lan_net = "{ 192.168.121.0/24, 192.168.122.0/24, 192.168.123.0/24 }"

# VoIP topology:
#
#   Yealink SIP-T33G 192.168.121.19
#       -> registers to local Asterisk on 192.168.121.1
#
#   Asterisk on the OpenBSD router
#       -> registers to Cosmote over the MAP-E IPv4 path on gif0
#
# The Yealink no longer talks directly to Cosmote. Keeping that split makes
# call routing, transfers, extra phones, and future VPN phones much easier.

phone_ip = "192.168.121.19"
asterisk_lan_ip = "192.168.121.1"
voip_ports = "{ 5060 }"
asterisk_rtp = "11780:11880"

icmp6_types = "{ echoreq echorep toobig unreach neighbrsol neighbradv routersol routeradv timex paramprob }"

# Replace with the local ULA prefix, if one is used.
ula_net = "fd00:1234:5678::/48"

# Administrative SSH sources. Keep empty until remote access is needed.
table <admin4> persist
table <admin6> persist

# Cosmote IPv4 CIDRs for SIP and RTP.
table <cosmote4> persist file "/etc/pf.tables/cosmote-ipv4.txt"

# Upload shaping for MAP-E IPv4 traffic.
# Measured upload is about 10 Mbps; shape below line rate to keep queues local.
queue mape_root on $mape_if bandwidth 9M max 9M
queue mape_voip parent mape_root bandwidth 1M min 300K
queue mape_std  parent mape_root bandwidth 8M default

block all
antispoof quick for { $wan $mape_if $lan_if }

# Prevent ULA leaks outside the private network
block out quick on $wan inet6 from $ula_net to any
block out quick on $mape_if inet6 from $ula_net to any
block in quick on $wan inet6 from any to $ula_net
block in quick on $mape_if inet6 from any to $ula_net

# SSH from the internet to this router.
#
# Add source addresses to <admin4> and <admin6> before enabling remote access.
pass in quick log on $mape_if inet  proto tcp from <admin4> to ($mape_if) port 22 flags S/SA keep state
pass in quick log on $wan     inet6 proto tcp from <admin6> to ($wan)     port 22 flags S/SA keep state

# The generated anchor clamps IPv4 TCP MSS to GIF_MTU minus 40.
# For a 1492-byte PPPoE WAN: tunnel MTU 1452, MSS 1412.

# MAP-E rules are loaded by /usr/local/libexec/maped/maped-up.
# Optional MAPED_PUBLISH_FILE services also use this anchor. Earlier block
# quick rules can prevent matching. Remove competing manual redirects/passes.
# The JSON example uses <admin4> above for SSH and permits any source for web.
anchor "mape"

# Default all outbound MAP-E IPv4 traffic into the shaped queue.
match out on $mape_if inet set queue mape_std

# Local SIP signaling from Yealink to Asterisk.
#
# The phone registers to Asterisk as extension 101 using UDP/5060.
# This is local LAN traffic only; Cosmote credentials live in Asterisk, not
# in the Yealink account.
pass in quick log on $lan_if inet proto udp from $phone_ip to $asterisk_lan_ip port $voip_ports keep state

# Local RTP media from Yealink to Asterisk.
#
# For calls such as the *43 echo test, the phone sends audio to the RTP port
# chosen by Asterisk. The range must match /etc/asterisk/rtp.conf.
pass in quick on $lan_if inet proto udp from $phone_ip to $asterisk_lan_ip port $asterisk_rtp keep state

# Local RTP media from Asterisk back to Yealink.
#
# This is needed because Asterisk runs on the router itself. With "block all",
# router-originated UDP from the Asterisk RTP range must be explicitly allowed
# back out to the phone.
pass out quick on $lan_if inet proto udp from $asterisk_lan_ip port $asterisk_rtp to $phone_ip keep state

# SIP trunk signaling from Asterisk to Cosmote.
#
# Asterisk registers to ims.otenet.gr / sdvims.otenet.gr using UDP/5060.
# The destination IPs are kept in <cosmote4> so they can be maintained without
# editing the main ruleset.
pass out quick log on $mape_if inet proto udp to <cosmote4> port $voip_ports set queue mape_voip keep state

# RTP media from Asterisk to Cosmote over the MAP-E IPv4 interface.
#
# Outbound calls and inbound answered calls use the Asterisk RTP range. The
# return RTP rule below allows media packets back to the router on that range.
pass out quick on $mape_if inet proto udp from ($mape_if) port $asterisk_rtp to <cosmote4> set queue mape_voip keep state
pass in  quick on $mape_if inet proto udp from <cosmote4> to ($mape_if) port $asterisk_rtp keep state

# LAN IPv4.
pass in on $lan_if inet from $lan_net to any keep state

# LAN IPv6, including neighbor discovery and router advertisements.
pass in  quick on $lan_if inet6 proto ipv6-icmp all keep state
pass out quick on $lan_if inet6 proto ipv6-icmp all keep state
pass in  on $lan_if inet6 from any to any keep state
pass out on $lan_if inet6 from any to any keep state

# IPv6 forwarding and router-originated IPv6 over PPPoE.
pass out on $wan inet6 from any to any keep state

# Required IPv6 control traffic on PPPoE, including Packet Too Big.
# PTB can originate at any router along the path, not just the MAP BR.
pass in  on $wan inet6 proto ipv6-icmp all icmp6-type $icmp6_types keep state
pass out on $wan inet6 proto ipv6-icmp all icmp6-type $icmp6_types keep state

# DHCPv6 client.
pass out on $wan inet6 proto udp from fe80::/10 port 546 to ff02::1:2 port 547 keep state
pass in  on $wan inet6 proto udp from fe80::/10 port 547 to fe80::/10 port 546 keep state
