# FTTH Cosmote values

WAN_IF="pppoe0"
GIF_IF="gif0"

PD_IF="em1"
LEASE_FILE="/var/db/dhcp6leased/pppoe0"
# Used when LEASE_FILE is missing or unreadable; mape-derive will call:
# dhcp6leasectl -l "$LEASE_IF"
LEASE_IF="pppoe0"

LAN_NET="{ 192.168.121.0/24 }"

# DHCP-provided values below are kept as fallbacks for testing or for older
# dhcp6leased versions. On OpenBSD 7.8 with MAP-E options, mape-derive prefers
# ia_pd, mape_br, mape_rule, and mape_portparams from dhcp6leased.
BR_IPV6="2a02:586::406"

MAP_IPV6_PREFIX="2a02:586:6200::"
MAP_IPV6_PLEN="42"
MAP_IPV4_PREFIX="87.xx.xx.0"
MAP_IPV4_PLEN="24"
EA_LEN="14"
PSID_OFFSET="6"

MAPE_PEER_IPV4="0.0.0.1"
GIF_MTU="1452"

# Generated PF Ruleset
PF_ANCHOR_FILE="/etc/pf.anchors/mape"

# Optional state directory for mape-watch.
MAPE_STATE_DIR="/var/db/mape"
# Optional mape-watch override.
MAPE_UP="/usr/local/sbin/mape-up"
# mape-watch logging: info, warn, or debug.
MAPE_LOG_LEVEL="info"
