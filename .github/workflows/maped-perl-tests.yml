name: maped tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maped-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: maped, metrics, and PF patch tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Portable tests use core Perl, POSIX sh, mocked networking tools, and
      # extracted C harnesses from openbsd/src/. OpenBSD-only sandbox checks are skipped.
      - name: Run maped Perl, helper, metrics, and PF tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          {
            CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" make test
          } 2>&1 | tee "$RUNNER_TEMP/maped-perl-tests.log"

      - name: Verify OpenBSD 7.9 patches against local baseline
        id: patches
        shell: bash
        run: |
          set -euo pipefail
          {
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            git archive 587e3b2 src | tar -x -C "$tmp"
            git show 76ec8f4:src/sys/net/pf_ioctl.c > "$tmp/src/sys/net/pf_ioctl.c"
            git show 76ec8f4 -- patch/pf-map-e-ce/mape79.patch | \
              awk '/^\+--- a\/sys\/net\/pf_ioctl\.c/{p=1} p{sub(/^\+/,""); print}' | \
              patch -R -p1 -d "$tmp/src"
            patch -p1 --fuzz=0 -d "$tmp/src" < openbsd/patches/7.9/pf-map-e-ce/mape79.patch
            patch -p1 --fuzz=0 -d "$tmp/src" < openbsd/patches/7.9/dhcp6leased-mape-softwire46-openbsd79.patch
            diff -ru "$tmp/src" openbsd/src
            for p in openbsd/patches/7.9/pf-map-e-ce/mape79.patch openbsd/patches/7.9/dhcp6leased-mape-softwire46-openbsd79.patch; do
              sum=$(sha256sum "$p" | awk '{print $1}')
              grep -Fq "$sum  $p" openbsd/tests/OPENBSD79.md || {
                echo "Checksum mismatch in openbsd/tests/OPENBSD79.md for $p (got $sum)" >&2
                exit 1
              }
            done
            echo "ok - OpenBSD 7.9 patches apply cleanly to local baseline and match openbsd/src/ and openbsd/tests/OPENBSD79.md"
          } 2>&1 | tee -a "$RUNNER_TEMP/maped-perl-tests.log"

      - name: Verify OpenBSD 7.9 patches against latest OPENBSD_7_9 CVS
        id: cvs_patches
        shell: bash
        run: |
          set -euo pipefail
          {
            command -v cvs >/dev/null || {
              sudo apt-get update -qq
              sudo apt-get install -y -qq cvs
            }
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            cat >> ~/.ssh/config <<'EOF'
          Host anoncvs*.openbsd.org anoncvs.spacehopper.org
              StrictHostKeyChecking accept-new
              BatchMode yes
              ConnectTimeout 15
          EOF
            chmod 600 ~/.ssh/config

            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            mapfile -t files < <(
              awk '
                /^--- a\// { f = substr($2, 3) }
                /^@@ -[1-9]/ && f != "" { print "src/" f; f = "" }
              ' openbsd/patches/7.9/pf-map-e-ce/mape79.patch openbsd/patches/7.9/dhcp6leased-mape-softwire46-openbsd79.patch
            )
            fetched=0
            for mirror in \
              anoncvs@anoncvs.ca.openbsd.org:/cvs \
              anoncvs@anoncvs.fr.openbsd.org:/cvs \
              anoncvs@anoncvs.spacehopper.org:/cvs; do
              echo "Checking out OPENBSD_7_9 sources from $mirror..."
              if (cd "$tmp" && cvs -q -d "$mirror" checkout -rOPENBSD_7_9 "${files[@]}"); then
                fetched=1
                break
              fi
              rm -rf "$tmp/src"
            done
            if [ "$fetched" -ne 1 ]; then
              echo "Failed to check out OPENBSD_7_9 sources from OpenBSD anoncvs mirrors" >&2
              exit 1
            fi
            patch -p1 --fuzz=0 -d "$tmp/src" < openbsd/patches/7.9/pf-map-e-ce/mape79.patch
            patch -p1 --fuzz=0 -d "$tmp/src" < openbsd/patches/7.9/dhcp6leased-mape-softwire46-openbsd79.patch
            CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              make pf-test OPENBSD_SRC="$tmp/src"
            echo "ok - OpenBSD 7.9 patches apply cleanly to latest OPENBSD_7_9 CVS and pass pf-test"
          } 2>&1 | tee -a "$RUNNER_TEMP/maped-perl-tests.log"

      - name: Report test failure
        if: ${{ failure() && (steps.tests.outcome == 'failure' || steps.patches.outcome == 'failure' || steps.cvs_patches.outcome == 'failure') }}
        shell: bash
        run: |
          echo '::error::maped test suite failed. See the test output and maped-perl-test-log artifact.'
          {
            echo '## maped test suite failed'
            echo
            echo "- Unit, helper, metrics, and PF tests: \`${{ steps.tests.outcome }}\`"
            echo "- Local baseline patch & checksum verification: \`${{ steps.patches.outcome }}\`"
            echo "- Latest \`OPENBSD_7_9\` CVS patch verification: \`${{ steps.cvs_patches.outcome }}\`"
            echo
            echo 'Run `make test` and `make pf-test OPENBSD_SRC=openbsd/src` locally to reproduce.'
            echo 'The full test output is available in the workflow step and the `maped-perl-test-log` artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed test log
        if: ${{ failure() && (steps.tests.outcome == 'failure' || steps.patches.outcome == 'failure' || steps.cvs_patches.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: maped-perl-test-log
          path: ${{ runner.temp }}/maped-perl-tests.log
          retention-days: 7
          if-no-files-found: warn
