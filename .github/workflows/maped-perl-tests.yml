name: maped tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maped-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: maped, metrics, and PF patch tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Portable tests use core Perl, POSIX sh, mocked networking tools, and
      # extracted C harnesses from src/. OpenBSD-only sandbox checks are skipped.
      - name: Run maped Perl, helper, metrics, and PF tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          {
            prove -v tests/maped*.t
            sh tests/maped-down-test.sh
            sh tests/maped-up-test.sh
            sh tests/run.sh
            sh tests/metrics-run.sh
            CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              make pf-test OPENBSD_SRC="$PWD/src"
          } 2>&1 | tee "$RUNNER_TEMP/maped-perl-tests.log"

      - name: Verify OpenBSD 7.9 patches and recorded checksums
        id: patches
        shell: bash
        run: |
          set -euo pipefail
          {
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            git archive 587e3b2 src | tar -x -C "$tmp"
            git show 76ec8f4:src/sys/net/pf_ioctl.c > "$tmp/src/sys/net/pf_ioctl.c"
            git show 76ec8f4 -- patch/pf-map-e-ce/mape79.patch | \
              awk '/^\+--- a\/sys\/net\/pf_ioctl\.c/{p=1} p{sub(/^\+/,""); print}' | \
              patch -R -p1 -d "$tmp/src"
            patch -p1 --fuzz=0 -d "$tmp/src" < patch/pf-map-e-ce/mape79.patch
            patch -p1 --fuzz=0 -d "$tmp/src" < patch/dhcp6leased-mape-softwire46-openbsd79.patch
            diff -ru "$tmp/src" src
            for p in patch/pf-map-e-ce/mape79.patch patch/dhcp6leased-mape-softwire46-openbsd79.patch; do
              sum=$(sha256sum "$p" | awk '{print $1}')
              grep -Fq "$sum  $p" tests/OPENBSD79.md || {
                echo "Checksum mismatch in tests/OPENBSD79.md for $p (got $sum)" >&2
                exit 1
              }
            done
            echo "ok - OpenBSD 7.9 patches apply cleanly and match src/ and tests/OPENBSD79.md"
          } 2>&1 | tee -a "$RUNNER_TEMP/maped-perl-tests.log"

      - name: Report test failure
        if: ${{ failure() && (steps.tests.outcome == 'failure' || steps.patches.outcome == 'failure') }}
        shell: bash
        run: |
          echo '::error::maped test suite failed. See the test output and maped-perl-test-log artifact.'
          {
            echo '## maped test suite failed'
            echo
            echo 'Run `make test` and `make pf-test OPENBSD_SRC=src` locally to reproduce.'
            echo 'The full test output is available in the workflow step and the `maped-perl-test-log` artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed test log
        if: ${{ failure() && (steps.tests.outcome == 'failure' || steps.patches.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: maped-perl-test-log
          path: ${{ runner.temp }}/maped-perl-tests.log
          retention-days: 7
          if-no-files-found: warn
