# mape.conf sample

# FTTH Cosmote values for PPPoE

# Network Configuration
WAN_IF="pppoe0"
LEASE_IF="pppoe0"
LAN_NET="{ 192.168.100.0/24 }" # Motify to match your setup

# Configure the gif interface
GIF_IF="gif0"
GIF_MTU="1452"
LEASE_FILE="/var/db/dhcp6leased/pppoe0"
PF_ANCHOR_FILE="/etc/pf.anchors/mape"

# MAPE daemon configuration
MAPE_STATE_DIR="/var/db/mape"
MAPE_PEER_IPV4="0.0.0.1"
MAPE_UP="/usr/local/sbin/mape-up"
MAPE_LOG_LEVEL="info"

# Legacy opts
# DHCP-provided values are derived from ia_pd, mape_br, mape_rule, and
# mape_portparams. Uncomment these only for testing or older dhcp6leased output.
#BR_IPV6="2a02:586::406"
#MAP_IPV6_PREFIX="2a02:586:6200::"
#MAP_IPV6_PLEN="42"
#MAP_IPV4_PREFIX="87.xx.xx.0"
#MAP_IPV4_PLEN="24"
#EA_LEN="14"
#PSID_OFFSET="6"
#PD_IF="em1" 
